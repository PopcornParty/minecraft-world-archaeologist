<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minecraft World Archaeologist</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app">
    <nav>
      <h1>World Archaeologist</h1>
      <p>Bedrock save history</p>
      <button data-route="dashboard" class="active">Dashboard</button>
      <button data-route="worlds">Worlds</button>
      <button data-route="import">Import</button>
      <button data-route="timeline">Timeline</button>
      <button data-route="analytics">Analytics</button>
      <button data-route="compare">Compare</button>
      <button data-route="map">Locations</button>
      <button data-route="journal">Journal</button>
      <button data-route="search">Search</button>
      <button data-route="achievements">Achievements</button>
      <p class="muted">/ search · g d dashboard · ? keys</p>
    </nav>
    <main id="view"></main>
  </div>
  <div class="help" id="help"><div>
    <h2>Keys</h2>
    <p>/ search</p>
    <p>g then d, w, t, j, a, i — dashboard, worlds, timeline, journal, analytics, import</p>
    <p>? close this panel</p>
  </div></div>
  <script src="/static/app.js"></script>
</body>
</html>
