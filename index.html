<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10130e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="stylesheet" href="./app.css?v=6">
  <title>World Archaeologist</title>
</head>
<body>
  <main id="view">
    <h2>Start a world</h2>
    <p>Records stay on this phone. Tap the button if the form does not appear.</p>
    <button class="primary" id="make" type="button">Create a world</button>
  </main>
  <nav class="bottom">
    <button data-route="dashboard" class="active">Home</button>
    <button data-route="add">Add</button>
    <button data-route="timeline">Time</button>
    <button data-route="economy">Money</button>
    <button data-route="more">More</button>
  </nav>
  <div class="sheet" id="sheet"><div class="card" id="sheet-card"></div></div>
  <div class="tip" id="tip"></div>
  <script src="./app.js?v=6"></script>
</body>
</html>
